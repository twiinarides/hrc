{% extends "admin/base.html" %}

{% block title %}{{ title }} | Hope Reception Centre Admin{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">Hope Reception Centre</a></h1>
{% endblock %}

{% block nav-global %}{% endblock %}

{% block extrastyle %}
<style>
    /* Custom Admin Theme for Hope Reception Centre */
    :root {
        --primary: #6B2D8B;       /* Royal Purple */
        --secondary: #C41230;     /* Crimson Red */
        --header-color: #ffffff;
        --header-bg: #6B2D8B;
        --header-link-color: #ffffff;
        
        --link-hover-color: #C41230;
        --button-bg: #6B2D8B;
        --button-hover-bg: #542270;
        --default-button-bg: #C41230;
        --default-button-hover-bg: #9E0E26;
        
        --selected-bg: #F5EDFA;
        --selected-row: #F5EDFA;
    }

    /* Header */
    #header {
        background-color: var(--header-bg);
        color: var(--header-color);
    }
    
    #header a:link, #header a:visited {
        color: var(--header-link-color);
    }
    
    #header a:hover {
        color: #F5EDFA;
    }

    /* Links */
    a:link, a:visited {
        color: var(--primary);
    }
    
    a:hover {
        color: var(--link-hover-color);
    }

    /* Buttons */
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: var(--button-bg);
        color: white;
    }
    
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: var(--button-hover-bg);
    }

    .button.default, input[type=submit].default, .submit-row input.default {
        background: var(--default-button-bg);
    }
    
    .button.default:hover, input[type=submit].default:hover {
        background: var(--default-button-hover-bg);
    }

    /* Modules (Tables) */
    div.breadcrumbs {
        background: #542270;
    }
    
    .module h2, .module caption, .inline-group h2 {
        background: var(--primary);
        color: white;
    }
    
    .viewlink, .addlink, .changelink {
        color: var(--primary);
    }

    /* Object tools */
    .object-tools a.addlink {
        background-color: var(--primary);
    }
    .object-tools a.addlink:hover {
        background-color: var(--button-hover-bg);
    }
    
    /* Login Form */
    .login #header {
        background-color: var(--primary);
        justify-content: center;
    }
    .login #header h1 {
        text-align: center;
        width: 100%;
        font-size: 24px;
    }
    .login .submit-row input {
        background: var(--secondary);
    }
    
    /* Checkbox & Selection */
    tr.selected {
        background-color: var(--selected-bg);
    }
</style>
{% endblock %}
