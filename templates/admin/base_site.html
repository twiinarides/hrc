{% extends "admin/base_site.html" %}
{% load static %}

{% block branding %}
<div id="site-name" style="display:flex;align-items:center;gap:10px;">
    <a href="{% url 'admin:index' %}" style="color:#ffffff;font-size:18px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;">
        <span style="background:#C41230;padding:4px 10px;border-radius:4px;font-size:14px;">HRC</span>
        Hope Reception Centre — Admin Console
    </a>
</div>
{% endblock %}

{% block userlinks %}
<a href="{% url 'admin_stats_dashboard' %}" style="color:#FFD700;font-weight:bold;margin-right:15px;"><i class="fa-solid fa-gauge"></i> Executive Dashboard</a>
<a href="{% url 'home' %}" target="_blank" style="color:#ffffff;margin-right:15px;">View Main Website →</a>
{{ block.super }}
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
/* Custom Django Admin Color Palette Matching HRC Brand */
:root {
    --primary: #6B2D8B !important;
    --secondary: #C41230 !important;
    --accent: #3d1455 !important;
    --header-bg: #3d1455 !important;
    --header-color: #ffffff !important;
    --link-color: #6B2D8B !important;
}

#header {
    background: linear-gradient(135deg, #3d1455 0%, #6B2D8B 60%, #C41230 100%) !important;
    color: #ffffff !important;
    padding: 12px 20px !important;
}

#header a:link, #header a:visited {
    color: #ffffff !important;
}

div.breadcrumbs {
    background: #501d68 !important;
    color: #e0d0eb !important;
}

div.breadcrumbs a {
    color: #ffffff !important;
}

.module h2, .module caption, .inline-group h2 {
    background: #6B2D8B !important;
    color: #ffffff !important;
}

.button, input[type=submit], input[type=button], .submit-row input, a.button {
    background: #6B2D8B !important;
    color: #ffffff !important;
    border: none !important;
    border-radius: 4px !important;
    padding: 8px 16px !important;

}

.button.default, input[type=submit].default {
    background: #C41230 !important;
}

.button:hover, input[type=submit]:hover {
    opacity: 0.9 !important;
}

#changelist table thead th {
    background: #f4ecf7 !important;
    color: #6B2D8B !important;
}

.object-tools a:link, .object-tools a:visited {
    background: #6B2D8B !important;
    color: #ffffff !important;
}

tr.alt {
    background: #faf6fc !important;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endblock %}
